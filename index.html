:root{color-scheme:dark;--bg:#0B0B0B;--bg2:#1A0505;--red:#E62429;--tx:#FFFFFF;--mute:#BDBDBD;--line:#2a1515;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
